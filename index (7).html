<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DI.MA. Navaltecnica</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#F5F7FA;color:#1A1A2E;font-size:14px}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#1F3864,#2E74B5);display:flex;align-items:center;justify-content:center}
.lbox{background:#fff;border-radius:16px;padding:40px;width:340px;max-width:95vw}
.lbox h1{color:#1F3864;font-size:20px;text-align:center;margin-bottom:4px}
.lbox p{color:#94A3B8;font-size:12px;text-align:center;margin-bottom:28px}
.anc{font-size:44px;text-align:center;display:block;margin-bottom:10px}
.lf{margin-bottom:16px}
.lf label{display:block;font-size:11px;font-weight:600;color:#64748B;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.lf input{width:100%;padding:11px 14px;border:1.5px solid #DEE2E8;border-radius:8px;font-size:14px;outline:none}
.lf input:focus{border-color:#2E74B5}
.lbtn{width:100%;padding:12px;background:#1F3864;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
.lbtn:hover{background:#2E74B5}
.lerr{background:#FFE0E0;color:#C00000;padding:10px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none;text-align:center}
.lhint{font-size:11px;color:#94A3B8;text-align:center;margin-top:14px}
#app{display:none;min-height:100vh}
.topbar{background:#1F3864;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px}
.topbar h2{font-size:16px;font-weight:700;flex:1}
.tb-user{font-size:12px;opacity:.7}
.tb-sync{font-size:11px;padding:3px 10px;border-radius:12px;background:rgba(255,255,255,.15)}
.tb-sync.ok{background:rgba(112,173,71,.3)}
.tb-sync.err{background:rgba(192,0,0,.3)}
.tb-out{cursor:pointer;opacity:.6;font-size:13px}
.tb-out:hover{opacity:1}
.nav{background:#fff;border-bottom:1px solid #DEE2E8;display:flex;overflow-x:auto;gap:0}
.nav-item{padding:12px 18px;font-size:13px;font-weight:600;cursor:pointer;color:#64748B;border-bottom:3px solid transparent;white-space:nowrap}
.nav-item:hover{color:#1F3864}
.nav-item.active{color:#1F3864;border-bottom-color:#2E74B5}
.content{padding:20px;max-width:1200px;margin:0 auto}
.card{background:#fff;border:1px solid #DEE2E8;border-radius:12px;padding:18px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;margin-bottom:14px;color:#1F3864}
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.kc{background:#fff;border:1px solid #DEE2E8;border-radius:10px;padding:14px;border-top:3px solid #2E74B5}
.kc.g{border-top-color:#70AD47}.kc.r{border-top-color:#C00000}.kc.a{border-top-color:#F59E0B}
.kl{font-size:11px;color:#64748B;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.kv{font-size:22px;font-weight:700}
.ks{font-size:11px;color:#94A3B8;margin-top:3px}
.kb{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin-top:5px}
.bg{background:#E2EFDA;color:#375623}.ba{background:#FFF2CC;color:#7D6608}.br{background:#FFE0E0;color:#C00000}.bb{background:#D6E4F0;color:#1F3864}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;background:#1F3864;color:#fff;font-size:12px;font-weight:600}
td{padding:8px 12px;border-bottom:1px solid #DEE2E8}
tr:last-child td{border-bottom:none}
tr:hover td{background:#F8FAFC}
.nr{text-align:right}.pos{color:#375623;font-weight:600}.neg{color:#C00000;font-weight:600}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase}
.pg{background:#E2EFDA;color:#375623}.pa{background:#FFF2CC;color:#7D6608}.pb{background:#EBF3FB;color:#2E74B5}.pgr{background:#F1F5F9;color:#595959}
.prog{height:5px;background:#DEE2E8;border-radius:3px;overflow:hidden;margin:3px 0}
.pbr{height:100%;border-radius:3px}.pbg{background:#70AD47}.pbb{background:#2E74B5}.pba{background:#F59E0B}
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;font-weight:600;color:#64748B;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fi,.fs{width:100%;padding:9px 12px;border:1.5px solid #DEE2E8;border-radius:8px;font-size:13px;font-family:inherit;outline:none}
.fi:focus,.fs:focus{border-color:#2E74B5}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.bp{background:#1F3864;color:#fff}.bp:hover{background:#2E74B5}
.bo{background:#fff;color:#1F3864;border:1.5px solid #1F3864}.bo:hover{background:#EBF3FB}
.bd{background:#FFE0E0;color:#C00000}
.alert{padding:11px 14px;border-radius:8px;font-size:13px;margin-bottom:10px;border-left:3px solid}
.alert.r{background:#FFE0E0;border-color:#C00000;color:#C00000}
.alert.a{background:#FFF2CC;border-color:#F59E0B;color:#7D6608}
.alert.b{background:#EBF3FB;border-color:#2E74B5;color:#2E74B5}
.alert.g{background:#E2EFDA;border-color:#70AD47;color:#375623}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #DEE2E8;border-top-color:#2E74B5;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px;color:#94A3B8}
/* Modulo Produttività */
.pr{background:#FFE0E0;color:#C00000}
.prod-bar{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:10px;padding:12px}
.prod-sub{font-size:11px;color:#94A3B8}
.prod-mini{padding:4px 9px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.prod-selrow td{background:#EBF3FB!important}
.prod-det{border:2px solid #2E74B5}
.prod-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.prod-grid{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.prod-ring{display:flex;flex-direction:column;align-items:center}
.prod-leg{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#64748B;margin-top:6px}
.prod-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.prod-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#DEE2E8;border:1px solid #DEE2E8;border-radius:10px;overflow:hidden}
.prod-nums>div{background:#fff;padding:10px 12px}
.prod-nums>div>span{display:block;font-size:11px;color:#64748B;font-weight:600}
.prod-nums b{display:block;font-size:19px;color:#1F3864;margin-top:2px}
.prod-nums em{display:block;font-style:normal;font-size:11px;color:#94A3B8;margin-top:2px}
.prod-par{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;margin-top:14px;padding:12px;background:#F5F7FA;border-radius:10px}
.prod-par .fg{margin-bottom:0}
.prod-note{font-size:11px;color:#64748B;line-height:1.5;max-width:900px;margin:4px 2px 20px}
.prod-sql{background:#1A1A2E;color:#E2EFDA;padding:10px;border-radius:6px;margin-top:8px;font-size:11px;white-space:pre-wrap;user-select:all}
.fi:focus-visible,.fs:focus-visible,.btn:focus-visible{outline:2px solid #2E74B5;outline-offset:2px}
@media(max-width:800px){.prod-grid{grid-template-columns:1fr}.prod-nums{grid-template-columns:1fr 1fr}.prod-nums>div:last-child{grid-column:span 2}.prod-par{grid-template-columns:1fr}.prod-bar{grid-template-columns:1fr 1fr}}
/* Microaree */
.ma-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.ma-tabs{display:flex;border:1px solid #DEE2E8;border-radius:8px;overflow:hidden;background:#fff}
.ma-tabs button{border:none;background:#fff;color:#64748B;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer}
.ma-tabs button.on{background:#1F3864;color:#fff}
.ma-empty p{max-width:640px;line-height:1.55;color:#475569}
.ma-scroll{overflow:auto;max-height:72vh}
.ma-mx{border-collapse:separate;border-spacing:0}
.ma-mx th{position:sticky;top:0;z-index:2;vertical-align:bottom}
.ma-mx .ma-st{position:sticky;left:0;z-index:1;background:#fff;min-width:190px;border-right:1px solid #DEE2E8}
.ma-mx th.ma-st{z-index:3;background:#1F3864}
.ma-mx tfoot td{background:#EBF3FB;border-top:2px solid #1F3864;vertical-align:top;font-size:12px}
.ma-mx tfoot .ma-st{background:#EBF3FB;font-weight:700;color:#1F3864}
.ma-fh{min-width:108px;text-align:center!important;line-height:1.25}
.ma-fh span{display:block;font-weight:400;font-size:10px;opacity:.75;margin-top:2px}
.ma-c{padding:3px!important;text-align:center}
.ma-c>button,.ma-c>div{position:relative;width:100%;min-height:46px;border:1px solid #DEE2E8;border-radius:6px;background:#fff;cursor:pointer;font-family:inherit;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
.ma-c>div{cursor:default}
.ma-c b{font-size:14px;color:#1F3864;position:relative;z-index:1}
.ma-c span{font-size:10px;color:#64748B;position:relative;z-index:1}
.ma-c i{position:absolute;left:0;bottom:0;height:4px;background:#2E74B5}
.ma-c em{position:absolute;top:2px;right:5px;font-style:normal;font-size:11px;font-weight:700;color:#C00000}
.ma-c>button:hover{border-color:#2E74B5;box-shadow:0 0 0 2px #D6E4F0}
.ma-p>button,.ma-p>div{background:#EBF3FB;border-color:#B7D0E8}
.ma-ok>button,.ma-ok>div{background:#E2EFDA;border-color:#A9D18E}
.ma-ok b{color:#375623}
.ma-w>button,.ma-w>div{border:2px solid #F59E0B;background:#FFFBEB}
.ma-na{color:#CBD5E1;background:repeating-linear-gradient(45deg,#F8FAFC,#F8FAFC 5px,#F1F5F9 5px,#F1F5F9 10px)}
.ma-tot{font-weight:600;color:#1F3864;white-space:nowrap}
.ma-ft b{display:block;font-size:14px;color:#1F3864}.ma-ft span{display:block;color:#64748B;font-size:10.5px}
.ma-leg{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:#64748B;margin:-6px 2px 18px;align-items:center}
.ma-leg i{display:inline-block;width:14px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid #DEE2E8}
.ma-leg .lp{background:#EBF3FB;border-color:#B7D0E8}.ma-leg .lok{background:#E2EFDA;border-color:#A9D18E}.ma-leg .lw{background:#FFFBEB;border:2px solid #F59E0B}.ma-leg .lna{background:repeating-linear-gradient(45deg,#F8FAFC,#F8FAFC 3px,#E2E8F0 3px,#E2E8F0 6px)}
.ma-ovl{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.ma-mod{background:#fff;border-radius:12px;padding:20px;width:440px;max-width:100%;max-height:92vh;overflow:auto}
.ma-wide{width:860px}
.ma-q{display:flex;gap:6px;flex-wrap:wrap}.ma-q .btn{padding:7px 11px;font-size:12px}
.ma-memo{background:#F5F7FA;border-radius:8px;padding:10px 12px;margin-bottom:12px}.ma-memo .fg{margin-bottom:0}
.ma-info{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#DEE2E8;border:1px solid #DEE2E8;border-radius:8px;overflow:hidden}
.ma-info div{background:#fff;padding:7px 9px}.ma-info span{display:block;font-size:10px;color:#64748B}.ma-info b{font-size:15px;color:#1F3864}
.ma-ed td{padding:5px 6px}.ma-ed .fi,.ma-ed .fs{padding:6px 8px;font-size:12px}
.ma-add{display:flex;gap:8px;margin-top:10px}
.ma-chk{width:18px;height:18px;cursor:pointer;accent-color:#1F3864}
.ma-danger{display:flex;justify-content:space-between;align-items:center;gap:12px;border-color:#F3C4C4}
.ma-st2>.card{margin-bottom:16px}
@media(max-width:800px){.ma-st2{grid-template-columns:1fr}.ma-info{grid-template-columns:1fr 1fr}.ma-mx .ma-st{min-width:130px}.ma-add{flex-wrap:wrap}}
@media(max-width:600px){.fr2{grid-template-columns:1fr}.kg{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <span class="anc">⚓</span>
    <h1>DI.MA. NAVALTECNICA</h1>
    <p>Portale Gestionale Interno</p>
    <div class="lerr" id="lerr">Email o password non corretti</div>
    <div class="lf"><label>Email</label><input type="email" id="lem" placeholder="nome@dimasrl.it"></div>
    <div class="lf"><label>Password</label><input type="password" id="lps" placeholder="••••••••"></div>
    <button class="lbtn" onclick="login()">Accedi</button>
    <p class="lhint">direzione@dimasrl.it · dima2026</p>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <h2>⚓ DI.MA. Navaltecnica</h2>
    <span class="tb-user" id="tb-user">—</span>
    <span class="tb-sync" id="tb-sync">connessione...</span>
    <span class="tb-out" onclick="logout()">Esci ↩</span>
  </div>
  <div class="nav">
    <div class="nav-item active" onclick="go('dash')">Dashboard</div>
    <div class="nav-item" onclick="go('comm')">Commesse</div>
    <div class="nav-item" onclick="go('rap')">Rapportino</div>
    <div class="nav-item" onclick="go('stor')">Storico</div>
    <div class="nav-item" onclick="go('prod')" id="nav-prod" style="display:none">Produttività</div>
    <div class="nav-item" onclick="go('fin')">Finanziario</div>
    <div class="nav-item" onclick="go('kpi')">KPI</div>
    <div class="nav-item" onclick="go('adm')" id="nav-adm" style="display:none">Admin</div>
  </div>
  <div class="content" id="content">
    <div class="empty"><div class="spin"></div>Caricamento...</div>
  </div>
</div>

<script>
const URL = "https://vodrwivqqnsliuhdvuro.supabase.co/rest/v1/";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZvZHJ3aXZxcW5zbGl1aGR2dXJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMDUxNDEsImV4cCI6MjA5NDU4MTE0MX0.i1Kvb9qUfVmcNPBsVc2jOMq5Ro-MJPdsHu8ZKe8vz54";
const H = {apikey:KEY, Authorization:"Bearer "+KEY, "Content-Type":"application/json", Prefer:"return=representation"};

async function sb(table, qs, method, body){
  try {
    const r = await fetch(URL+table+(qs?"?"+qs:""), {method:method||"GET", headers:H, body:body?JSON.stringify(body):undefined});
    const d = await r.text();
    return {data: d?JSON.parse(d):[], ok:r.ok, status:r.status};
  } catch(e) { return {data:null, ok:false, error:e.message}; }
}

const USERS = {
  "direzione@dimasrl.it":  {pass:"dima2026",   nome:"Direzione",       ruolo:"direzione",       pages:["dash","comm","rap","stor","prod","fin","kpi","adm"]},
  "cantiere@dimasrl.it":   {pass:"cantiere1",   nome:"Capo Cantiere",   ruolo:"cantiere",        pages:["rap","comm","stor"]},
  "admin@dimasrl.it":      {pass:"admin123",    nome:"Amministrazione", ruolo:"amministrazione", pages:["dash","fin","kpi","stor","prod"]},
};

let CU = null, cache = {commesse:[], risorse:[]};

async function login(){
  const em = document.getElementById("lem").value.trim().toLowerCase();
  const ps = document.getElementById("lps").value;
  const u = USERS[em];
  if(!u||u.pass!==ps){document.getElementById("lerr").style.display="block"; return;}
  document.getElementById("lerr").style.display="none";
  CU = {email:em, ...u};
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("tb-user").textContent = u.nome+" ("+u.ruolo+")";
  if(u.ruolo==="direzione") document.getElementById("nav-adm").style.display="block";
  document.getElementById("nav-prod").style.display = u.pages.includes("prod") ? "block" : "none";
  await loadCache();
  go(u.pages[0]);
}

function logout(){
  document.getElementById("app").style.display="none";
  document.getElementById("login").style.display="flex";
  document.getElementById("lem").value="";
  document.getElementById("lps").value="";
  CU=null;
}

document.getElementById("lps").addEventListener("keypress", e=>{ if(e.key==="Enter") login(); });

async function loadCache(){
  sync("caricamento...", false);
  const [c,r] = await Promise.all([
    sb("commesse","select=*&order=codice"),
    sb("risorse","select=*&order=nominativo")
  ]);
  cache.commesse = c.data||[];
  cache.risorse  = r.data||[];
  sync(c.ok ? "● Connesso" : "⚠ Offline", c.ok);
}

function sync(msg, ok){
  const e = document.getElementById("tb-sync");
  if(e){ e.textContent=msg; e.className="tb-sync"+(ok?" ok":" err"); }
}

function go(p){
  if(CU && !CU.pages.includes(p)){alert("Sezione non disponibile."); return;}
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n=>{ if(n.getAttribute("onclick")&&n.getAttribute("onclick").includes("'"+p+"'")) n.classList.add("active"); });
  const c = document.getElementById("content");
  c.scrollTop = 0;
  const pages = {dash:pgDash, comm:pgComm, rap:pgRap, stor:pgStor, prod:pgProd, fin:pgFin, kpi:pgKpi, adm:pgAdm};
  if(pages[p]) pages[p](c);
  else c.innerHTML = "<div class='empty'>Pagina in costruzione.</div>";
}

// ── DASHBOARD ──────────────────────────────────────────────────────────
function pgDash(c){
  const comm = cache.commesse;
  const tR = comm.reduce((a,x)=>a+(x.ricavo||0),0);
  const tM = comm.reduce((a,x)=>a+(x.ricavo||0)-(x.costo_budget||0),0);
  const inC = comm.filter(x=>x.stato==="In corso").length;
  c.innerHTML =
    '<div class="kg">' +
    '<div class="kc b"><div class="kl">Ricavi portafoglio</div><div class="kv">€'+(tR/1000).toFixed(0)+'K</div><span class="kb bb">+25,5% YoY</span></div>' +
    '<div class="kc g"><div class="kl">Margine lordo</div><div class="kv">€'+(tM/1000).toFixed(0)+'K</div><span class="kb bg">'+(tR?((tM/tR)*100).toFixed(1):0)+'%</span></div>' +
    '<div class="kc b"><div class="kl">Commesse attive</div><div class="kv">'+inC+'</div><div class="ks">su '+comm.length+' totali</div></div>' +
    '<div class="kc g"><div class="kl">DSCR</div><div class="kv">7,05x</div><span class="kb bg">OTTIMO</span></div>' +
    '<div class="kc a"><div class="kl">DSO</div><div class="kv">97 gg</div><span class="kb ba">Target 80</span></div>' +
    '<div class="kc r"><div class="kl">Debiti tribut.</div><div class="kv">€990K</div><span class="kb ba">Rateizz.</span></div>' +
    '</div>' +
    '<div class="card"><div class="card-title">Avanzamento commesse</div>' +
    comm.slice(0,5).map(x=>'<div style="margin-bottom:11px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span><strong>'+x.codice+'</strong> — '+x.cliente+'</span><span>'+x.avanzamento+'%</span></div><div class="prog"><div class="pbr '+(x.avanzamento>70?"pbg":x.avanzamento>40?"pbb":"pba")+'" style="width:'+x.avanzamento+'%"></div></div></div>').join("") +
    '</div>' +
    '<div class="card"><div class="card-title">Alert prioritari</div>' +
    '<div class="alert a">⚠ DSO 97 gg — attivare factoring pro-soluto su Fincantieri</div>' +
    '<div class="alert r">🔴 Avvisi bonari €325.653 — definizione entro Q2 2026</div>' +
    '<div class="alert b">ℹ Business case mutuo €500K — DSCR post-finanz. 4,70x</div>' +
    '</div>';
}

// ── COMMESSE ──────────────────────────────────────────────────────────
function pgComm(c){
  const comm = cache.commesse;
  const rows = comm.map(x=>{
    const m = x.ricavo - x.costo_budget;
    const sc = x.stato==="In corso"?"pb":x.stato==="Avvio"?"pa":x.stato==="Chiusa"?"pg":"pgr";
    return '<tr><td><strong>'+x.codice+'</strong><br><span style="font-size:11px;color:#94A3B8">'+(x.descrizione||"")+'</span></td>' +
      '<td>'+x.cliente+'</td><td>'+x.cantiere+'</td>' +
      '<td><span class="pill '+sc+'">'+x.stato+'</span></td>' +
      '<td class="nr">€'+(x.ricavo||0).toLocaleString("it-IT")+'</td>' +
      '<td class="nr pos">€'+m.toLocaleString("it-IT")+'</td>' +

// Microaree disponibili per la commessa selezionata nel rapportino
let rapMA = {cid:null, has:false, groups:[]};
async function rapMALoad(cid){
  rapMA = {cid:cid, has:false, groups:[], loading:true};
  rapMARefresh();
  const s = await maLoadStruttura(cid);
  if(rapMA.cid!==cid) return;
  rapMA.loading=false;
  if(s.ok && s.cells.length){
    const fById={}; s.fasi.forEach(f=>fById[f.id]=f);
    const cellBy={}; s.cells.forEach(x=>cellBy[x.item_id+"|"+x.fase_id]=x);
    rapMA.groups = s.items.filter(it=>it.esecutore!=="Terzi").map(it=>({
      label:(it.codice||"")+(it.descrizione?" — "+it.descrizione:""),
      opts:s.fasi.map(f=>cellBy[it.id+"|"+f.id]).filter(x=>x&&x.applicabile).map(x=>({id:x.id, label:(it.codice||"")+" · "+fById[x.fase_id].nome+((+x.perc||0)>=100?" ✓ completata":"")}))
    })).filter(g=>g.opts.length);
    rapMA.has = rapMA.groups.length>0;
  }
  rapMARefresh();
}
function rapMAOptions(sel){
  if(rapMA.loading) return '<option value="">caricamento...</option>';
  if(!rapMA.has) return '<option value="">nessuna microarea</option>';
  return '<option value="">— seleziona —</option><option value="gen"'+(sel==="gen"?" selected":"")+'>Generale / non attribuibile</option>' +
    rapMA.groups.map(g=>'<optgroup label="'+esc(g.label)+'">'+g.opts.map(o=>'<option value="'+o.id+'"'+(sel===o.id?" selected":"")+'>'+esc(o.label)+'</option>').join("")+'</optgroup>').join("");
}
function rapMARefresh(){
  document.querySelectorAll(".r-ma").forEach(s=>{
    const i=+s.dataset.i; const keep = rapR[i] && rapR[i].ma;
    const valid = keep && (keep==="gen" || rapMA.groups.some(g=>g.opts.some(o=>o.id===keep)));
    if(rapR[i]) rapR[i].ma = valid?keep:"";
    s.innerHTML = rapMAOptions(valid?keep:"");
    s.disabled = !rapMA.has;
  });
  const n=document.getElementById("rma-note");
  if(n) n.innerHTML = rapMA.has ? 'Per ogni riga indica la microarea (item · lavorazione) su cui la risorsa ha lavorato. Se una risorsa lavora su più microaree nella stessa giornata, aggiungi una riga per ciascuna e indica la trasferta una sola volta.' : '';
}

function addRap(){
  const i = rapR.length; rapR.push({});
  const optR = cache.risorse.map(x=>'<option value="'+x.id+'|'+x.nominativo+'|'+x.costo_ord+'">'+x.nominativo+' — '+x.qualifica+'</option>').join("");
  const tr = document.createElement("tr"); tr.id="rr"+i;
  tr.innerHTML =
    '<td><select class="fs r-ris" style="font-size:12px" onchange="setRis('+i+',this)"><option value="">— seleziona —</option>'+optR+'</select></td>' +
    '<td><select class="fs r-ma" data-i="'+i+'" style="font-size:12px;min-width:170px" onchange="rapR['+i+'].ma=this.value">'+rapMAOptions("")+'</select></td>' +
    '<td><input type="number" class="fi r-ord" style="width:65px;font-size:12px;padding:5px 8px" min="0" max="12" step="0.5" value="0" oninput="calcRap('+i+')"></td>' +
    '<td><input type="number" class="fi r-str" style="width:65px;font-size:12px;padding:5px 8px" min="0" max="6" step="0.5" value="0" oninput="calcRap('+i+')"></td>' +
    '<td><select class="fs r-tipo" style="font-size:12px" onchange="calcRap('+i+')">' +
    '<option value="1.25">+25%</option><option value="1.30">STR30 +30%</option><option value="1.50">STR50 +50%</option>' +
    '</select></td>' +
    '<td><input type="number" class="fi r-traf" style="width:75px;font-size:12px;padding:5px 8px" min="0" value="0" oninput="calcRap('+i+')"></td>' +
    '<td class="nr" id="rt'+i+'" style="font-weight:600;color:#1F3864">€ 0,00</td>' +
    '<td><button onclick="delRap('+i+')" style="border:none;background:none;cursor:pointer;color:#C00000;font-size:16px">✕</button></td>';
  document.getElementById("rtb").appendChild(tr);
  if(!rapMA.has) tr.querySelector(".r-ma").disabled=true;
}

function setRis(i, s){
  if(!s.value) return;
  const p = s.value.split("|");
  rapR[i] = {...rapR[i], risorsa_id:p[0], nominativo:p[1], costo_ora:parseFloat(p[2])||0};
  calcRap(i);
}

function calcRap(i){
  const tr = document.getElementById("rr"+i); if(!tr) return;
  const q = c=>tr.querySelector(c);
  const ord=parseFloat(q(".r-ord").value)||0, str=parseFloat(q(".r-str").value)||0;
  const coef=parseFloat(q(".r-tipo").value)||1.25, traf=parseFloat(q(".r-traf").value)||0;
  const r = rapR[i]; const tot=(ord+str*coef)*(r.costo_ora||0)+traf;
  rapR[i] = {...r, ore_ord:ord, ore_str:str, tipo_str:str>0?(coef===1.5?"STR50":coef===1.3?"STR30":"STR25"):"ORD", trasferta:traf, costo_giorno:tot};
  const el=document.getElementById("rt"+i); if(el) el.textContent="€ "+tot.toFixed(2);
  const gt=document.getElementById("gtot"); if(gt) gt.textContent="€ "+rapR.reduce((a,r)=>a+(r&&r.costo_giorno||0),0).toFixed(2);
}

function delRap(i){
  const tr=document.getElementById("rr"+i); if(tr) tr.remove(); rapR[i]=null;
  const gt=document.getElementById("gtot"); if(gt) gt.textContent="€ "+rapR.reduce((a,r)=>a+(r&&r.costo_giorno||0),0).toFixed(2);
}

async function salvaRap(){
  const cs=document.getElementById("rc"); if(!cs||!cs.value){alert("Seleziona una commessa.");return;}
  const p=cs.value.split("|"); const cid=p[0], ccod=p[1];
  const righe=rapR.filter(r=>r&&r.risorsa_id&&(r.ore_ord>0||r.ore_str>0));
  if(!righe.length){alert("Inserisci almeno una riga con ore.");return;}
  const el=document.getElementById("msg-r");
  if(rapMA.loading){ el.innerHTML='<div class="alert a">Attendi il caricamento delle microaree della commessa.</div>'; return; }
  if(rapMA.has && rapMA.cid===cid){
    const manc = righe.filter(r=>!r.ma);
    if(manc.length){ el.innerHTML='<div class="alert r">Indica la microarea per: '+esc(manc.map(r=>r.nominativo).join(", "))+'. Se l\'attività non è riferibile a un item, scegli "Generale / non attribuibile".</div>'; return; }
  }
  const tot=righe.reduce((a,r)=>a+(r.costo_giorno||0),0);
  el.innerHTML='<div class="alert b"><div class="spin"></div>Salvataggio...</div>';
  sync("salvataggio...",false);
  const rap = await sb("rapportini","","POST",{
    data_lavoro:document.getElementById("rd").value,
    commessa_id:cid, commessa_cod:ccod,
    cantiere:document.getElementById("rca").value||"",
    caposquadra:document.getElementById("rcp").value||CU.nome,
    totale_costo:tot, salvato_da:CU.email
  });
  if(!rap.ok){el.innerHTML='<div class="alert r">Errore: '+esc(rap.data?.message||"risposta vuota")+'</div>';sync("● Errore",false);return;}
  const rid=Array.isArray(rap.data)?rap.data[0]?.id:rap.data?.id;
  if(rid){
    const withMA = rapMA.has && rapMA.cid===cid;
    const rr=righe.map(r=>{
      const o={rapportino_id:rid,risorsa_id:r.risorsa_id,nominativo:r.nominativo||"",ore_ord:r.ore_ord,ore_str:r.ore_str,tipo_str:r.tipo_str,trasferta:r.trasferta,costo_ora:r.costo_ora,costo_giorno:r.costo_giorno};
      if(withMA) o.microarea_id = r.ma==="gen"?null:r.ma;
      return o;
    });
    const rs = await sb("rapportino_righe","","POST",rr);
    if(!rs.ok){
      await sb("rapportini","id=eq."+rid,"DELETE");
      sync("● Errore",false);
      const t=(rs.data&&rs.data.message)||rs.error||("HTTP "+rs.status);
      el.innerHTML='<div class="alert r">Righe del rapportino non salvate, rapportino annullato: '+esc(t)+(/microarea_id/i.test(t)?'<br>Esegui prima il file migrazione_microaree.sql in Supabase → SQL Editor.':'')+'</div>';
      return;
    }
  }
  sync("● Connesso",true);
  el.innerHTML='<div class="alert g">✅ Rapportino salvato! '+esc(ccod)+' — €'+tot.toFixed(2)+'</div>';
  setTimeout(()=>{ if(document.getElementById("msg-r")) go("rap"); },2500);
}

// ── PRODUTTIVITÀ: CONSUNTIVO COMMESSA E MONTE ORE ─────────────────────
// Monte ore = (Ricavo − Margine riservato) ÷ Costo orario
// Ore guadagnate = Monte ore × % avanzamento
// Indice di produttività = Ore guadagnate ÷ Ore effettive da rapportini
const PROD_OK = 1.00, PROD_ATT = 0.90;
let prodRap = null, prodRows = [], prodSel = null;
let prodF = {stato:"attive", cantiere:"", q:""};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function fN(v,d){ if(v==null||!isFinite(v)) return "—"; return Number(v).toLocaleString("it-IT",{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function fE(v){ return v==null||!isFinite(v) ? "—" : "€ "+fN(v,0); }
function fP(v,d){ return v==null||!isFinite(v) ? "—" : fN(v*100,d==null?1:d)+"%"; }
function fD(s){ if(!s) return "—"; const p=String(s).slice(0,10).split("-"); return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:s; }
const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function fM(k){ const p=k.split("-"); return MESI[(+p[1])-1]+" "+p[0]; }

async function prodLoadRap(){
  let all=[], off=0; const step=1000;
  while(true){
    const r = await sb("rapportini","select=id,commessa_id,commessa_cod,data_lavoro,totale_costo,rapportino_righe(nominativo,ore_ord,ore_str,costo_giorno)&order=data_lavoro.asc&limit="+step+"&offset="+off);
    if(!r.ok) return {ok:false, data:all, msg:(r.data&&r.data.message)||r.error||("HTTP "+r.status)};
    const d = Array.isArray(r.data)?r.data:[];
    all = all.concat(d);
    if(d.length<step || off>100000) break;
    off += step;
  }
  return {ok:true, data:all};
}

function prodSemaforo(x){
  if(x.stato==="parametri") return {cls:"pgr", txt:"Parametri", tip:"Imposta margine riservato e costo orario"};
  if(x.oreEff>0 && x.A===0) return {cls:"pa", txt:"Avanz. 0%", tip:"Ci sono ore registrate ma l'avanzamento è fermo a 0%"};
  if(x.IP==null) return {cls:"pgr", txt:"Nessuna ora", tip:"Nessun rapportino registrato"};
  if(x.IP>=PROD_OK) return {cls:"pg", txt:fN(x.IP,2), tip:"In linea o sopra il monte ore"};
  if(x.IP>=PROD_ATT) return {cls:"pa", txt:fN(x.IP,2), tip:"Leggero sforamento: da monitorare"};
  return {cls:"pr", txt:fN(x.IP,2), tip:"Ore consumate oltre l'avanzamento raggiunto"};
}

function prodCalc(){
  const comm = cache.commesse||[], ris = cache.risorse||[], rap = prodRap||[];
  const cr = ris.map(x=>+x.costo_ord||0).filter(v=>v>0);
  const medioAnag = cr.length ? cr.reduce((a,b)=>a+b,0)/cr.length : 0;
  const byId={}, byCod={};
  comm.forEach(c=>{ byId[String(c.id)]=c; if(c.codice) byCod[String(c.codice)]=c; });
  const agg={}; let orfani=0;
  rap.forEach(r=>{
    const c = byId[String(r.commessa_id)] || byCod[String(r.commessa_cod)];
    if(!c){ orfani++; return; }
    const k=String(c.id);
    const a = agg[k] || (agg[k]={ore:0,oreOrd:0,oreStr:0,costo:0,giorni:{},first:null,last:null,mesi:{},ris:{}});
    const righe = r.rapportino_righe||[];
    let oreR=0, costoR=0;
    righe.forEach(l=>{
      const oo=+l.ore_ord||0, os=+l.ore_str||0, cg=+l.costo_giorno||0;
      oreR+=oo+os; costoR+=cg; a.oreOrd+=oo; a.oreStr+=os;
      const nk=l.nominativo||"—";
      const rr=a.ris[nk]||(a.ris[nk]={ore:0,costo:0,gg:{}});
      rr.ore+=oo+os; rr.costo+=cg; if(r.data_lavoro) rr.gg[r.data_lavoro]=1;
    });
    if(!righe.length) costoR=+r.totale_costo||0;
    a.ore+=oreR; a.costo+=costoR;
    const dl=r.data_lavoro||"";
    if(dl){
      a.giorni[dl]=1;
      if(!a.first||dl<a.first) a.first=dl;
      if(!a.last||dl>a.last) a.last=dl;
      const mk=dl.slice(0,7);
      const m=a.mesi[mk]||(a.mesi[mk]={ore:0,costo:0,gg:{}});
      m.ore+=oreR; m.costo+=costoR; m.gg[dl]=1;
    }
  });

  prodRows = comm.map(c=>{
    const a = agg[String(c.id)] || {ore:0,oreOrd:0,oreStr:0,costo:0,giorni:{},first:null,last:null,mesi:{},ris:{}};
    const R=+c.ricavo||0, B=+c.costo_budget||0;
    const A=Math.min(Math.max(+c.avanzamento||0,0),100)/100;
    const costoEff = a.ore>0 ? a.costo/a.ore : 0;
    let M=null, mSrc="da impostare";
    if(c.margine_riservato!=null && c.margine_riservato!==""){ M=(+c.margine_riservato)/100; mSrc="impostato"; }
    else if(R>0 && B>0 && B<R){ M=(R-B)/R; mSrc="da budget costo"; }
    let Ch=null, hSrc="da impostare";
    if(+c.costo_orario>0){ Ch=+c.costo_orario; hSrc="impostato"; }
    else if(costoEff>0){ Ch=costoEff; hSrc="media rapportini"; }
    else if(medioAnag>0){ Ch=medioAnag; hSrc="media anagrafica risorse"; }
    const x = {c, id:String(c.id), codice:c.codice, cliente:c.cliente, cantiere:c.cantiere, statoComm:c.stato,
      R, A, M, mSrc, Ch, hSrc, oreEff:a.ore, oreOrd:a.oreOrd, oreStr:a.oreStr, costoEff:a.costo,
      nGiorni:Object.keys(a.giorni).length, first:a.first, last:a.last, mesi:a.mesi, ris:a.ris};
    if(M==null || Ch==null || R<=0){
      x.stato="parametri"; x.MO=null; x.oreGuad=null; x.oreRes=null; x.IP=null; x.budgetMdo=null;
    } else {
      x.stato="ok";
      x.budgetMdo = R*(1-M);
      x.MO = x.budgetMdo/Ch;
      x.oreGuad = x.MO*A;
      x.oreRes = x.MO - x.oreEff;
      x.IP = (x.oreEff>0 && A>0) ? x.oreGuad/x.oreEff : null;
      x.consumo = x.MO>0 ? x.oreEff/x.MO : null;
      x.eacOre = (x.oreEff>0 && A>0) ? x.oreEff/A : null;
      x.eacCosto = (x.costoEff>0 && A>0) ? x.costoEff/A : null;
      x.scostOre = x.eacOre!=null ? x.MO - x.eacOre : null;
      x.margFin = x.eacCosto!=null ? (R - x.eacCosto)/R : null;
    }
    x.sem = prodSemaforo(x);
    return x;
  });
  return {orfani};
}

async function pgProd(c){
  c.innerHTML='<div class="empty"><div class="spin"></div>Caricamento rapportini...</div>';
  const r = await prodLoadRap();
  if(!r.ok && !r.data.length){ c.innerHTML='<div class="alert r">Rapportini non leggibili dal database: '+esc(r.msg)+'</div>'; return; }
  prodRap = r.data;
  const info = prodCalc();
  const cants = [...new Set((cache.commesse||[]).map(x=>x.cantiere).filter(Boolean))].sort();
  c.innerHTML =
    (r.ok?"":'<div class="alert a">Lettura parziale dei rapportini: '+esc(r.msg)+'</div>') +
    (info.orfani?'<div class="alert a">'+info.orfani+' rapportini non sono collegati a nessuna commessa in archivio e sono esclusi dal calcolo.</div>':'') +
    '<div id="prod-kpi"></div>' +
    '<div id="prod-det"></div>' +
    '<div class="card prod-bar">' +
      '<select class="fs" id="pf-s" onchange="prodFil()">' +
        [["attive","Commesse non chiuse"],["tutte","Tutte le commesse"],["In corso","In corso"],["Avvio","Avvio"],["Sospesa","Sospesa"],["Chiusa","Chiuse"],["allerta","Solo in allerta"]]
        .map(o=>'<option value="'+o[0]+'"'+(prodF.stato===o[0]?" selected":"")+'>'+o[1]+'</option>').join("") +
      '</select>' +
      '<select class="fs" id="pf-c" onchange="prodFil()"><option value="">Tutti i cantieri</option>'+cants.map(x=>'<option'+(prodF.cantiere===x?" selected":"")+'>'+esc(x)+'</option>').join("")+'</select>' +
      '<input class="fi" id="pf-q" placeholder="Cerca codice o cliente" value="'+esc(prodF.q)+'" oninput="prodFil()">' +
      '<button class="btn bo" onclick="pgProd(document.getElementById(\'content\'))">↺ Aggiorna</button>' +
    '</div>' +
    '<div id="prod-tab"></div>' +
    '<p class="prod-note">Monte ore = (ricavo − margine riservato) ÷ costo orario. Ore guadagnate = monte ore × avanzamento. ' +
    'Indice di produttività = ore guadagnate ÷ ore effettive dei rapportini: sopra 1,00 la commessa consuma meno ore del previsto, sotto 0,90 è in allerta. ' +
    'Il costo orario dei rapportini comprende maggiorazioni e trasferte. L\'indice è attendibile solo se i rapportini sono completi e l\'avanzamento è aggiornato.</p>';
  prodRender();
  if(prodSel && prodRows.find(x=>x.id===prodSel)) prodDet(prodSel,true);
}

function prodFil(){
  prodF.stato=document.getElementById("pf-s").value;
  prodF.cantiere=document.getElementById("pf-c").value;
  prodF.q=document.getElementById("pf-q").value.trim().toLowerCase();
  prodRender();
}

function prodVis(){
  return prodRows.filter(x=>{
    if(prodF.stato==="attive" && x.statoComm==="Chiusa") return false;
    if(prodF.stato==="allerta" && !(x.sem.cls==="pr"||x.sem.cls==="pa")) return false;
    if(!["attive","tutte","allerta"].includes(prodF.stato) && x.statoComm!==prodF.stato) return false;
    if(prodF.cantiere && x.cantiere!==prodF.cantiere) return false;
    if(prodF.q && !((x.codice||"")+" "+(x.cliente||"")).toLowerCase().includes(prodF.q)) return false;
    return true;
  }).sort((a,b)=>{
    const rank=s=>({pr:0,pa:1,pg:2,pgr:3}[s.cls]);
    return rank(a.sem)-rank(b.sem) || (a.IP??9)-(b.IP??9);
  });
}

function prodRender(){
  const v = prodVis();
  const calc = v.filter(x=>x.IP!=null);
  const sG = calc.reduce((a,x)=>a+x.oreGuad,0), sE = calc.reduce((a,x)=>a+x.oreEff,0);
  const ipTot = sE>0 ? sG/sE : null;
  const oreTot = v.reduce((a,x)=>a+x.oreEff,0), costoTot = v.reduce((a,x)=>a+x.costoEff,0);
  const nRos = v.filter(x=>x.sem.cls==="pr").length, nPar = v.filter(x=>x.stato==="parametri").length;
  const ipCls = ipTot==null?"":ipTot>=PROD_OK?"g":ipTot>=PROD_ATT?"a":"r";
  document.getElementById("prod-kpi").innerHTML =
    '<div class="kg">' +
    '<div class="kc '+ipCls+'"><div class="kl">Indice produttività</div><div class="kv">'+(ipTot==null?"—":fN(ipTot,2))+'</div><div class="ks">su '+calc.length+' commesse misurabili</div></div>' +
    '<div class="kc b"><div class="kl">Ore effettive</div><div class="kv">'+fN(oreTot)+'</div><div class="ks">da rapportini</div></div>' +
    '<div class="kc b"><div class="kl">Ore guadagnate</div><div class="kv">'+fN(sG)+'</div><div class="ks">monte ore × avanzamento</div></div>' +
    '<div class="kc b"><div class="kl">Costo manodopera</div><div class="kv">€'+fN(costoTot/1000)+'K</div><div class="ks">consuntivo rapportini</div></div>' +
    '<div class="kc '+(nRos?"r":"g")+'"><div class="kl">In allerta</div><div class="kv">'+nRos+'</div><div class="ks">indice sotto '+fN(PROD_ATT,2)+'</div></div>' +
    (nPar?'<div class="kc"><div class="kl">Senza parametri</div><div class="kv">'+nPar+'</div><div class="ks">margine o costo orario</div></div>':'') +
    '</div>';
  if(!v.length){ document.getElementById("prod-tab").innerHTML='<div class="empty">Nessuna commessa corrisponde ai filtri.</div>'; return; }
  document.getElementById("prod-tab").innerHTML =

const PROD_SQL = "alter table public.commesse add column if not exists margine_riservato numeric(5,2), add column if not exists costo_orario numeric(8,2);\nnotify pgrst, 'reload schema';";

async function prodSalvaPar(id){
  const msg = document.getElementById("prod-msg");
  const mv = document.getElementById("pp-m").value.trim(), hv = document.getElementById("pp-h").value.trim();
  const m = mv===""?null:parseFloat(mv.replace(",",".")), h = hv===""?null:parseFloat(hv.replace(",","."));
  if(m!=null && (isNaN(m)||m<0||m>=100)){ msg.innerHTML='<div class="alert r">Il margine riservato deve essere compreso tra 0 e 99%.</div>'; return; }
  if(h!=null && (isNaN(h)||h<=0)){ msg.innerHTML='<div class="alert r">Il costo orario deve essere maggiore di zero.</div>'; return; }
  sync("salvataggio...",false);
  const r = await sb("commesse","id=eq."+id,"PATCH",{margine_riservato:m, costo_orario:h});
  if(!r.ok){
    const t = (r.data&&(r.data.message||r.data.code))||r.error||"";
    sync("● Errore",false);
    if(/margine_riservato|costo_orario|PGRST204|schema cache|column/i.test(t)){
      msg.innerHTML='<div class="alert r"><strong>Colonne mancanti nel database.</strong> Per salvare i parametri esegui una volta questo comando in Supabase → SQL Editor, poi riprova:<pre class="prod-sql">'+esc(PROD_SQL)+'</pre></div>';
    } else msg.innerHTML='<div class="alert r">Salvataggio non riuscito: '+esc(t||("HTTP "+r.status))+'</div>';
    return;
  }
  const c = (cache.commesse||[]).find(x=>String(x.id)===id);
  if(c){ c.margine_riservato=m; c.costo_orario=h; }
  sync("● Connesso",true);
  prodCalc(); prodDet(id,true);
  document.getElementById("prod-msg").innerHTML='<div class="alert g">✅ Parametri salvati e monte ore ricalcolato.</div>';
}

// ── MICROAREE DI COMMESSA ─────────────────────────────────────────────
// Commessa → Item (es. singola porta) → Lavorazione (fase). Ogni incrocio
// applicabile è una microarea su cui si registrano ore e avanzamento.
let MA = null;
const MA_SQL_MSG = 'Le tabelle delle microaree non sono ancora presenti nel database. Esegui una volta il file <strong>migrazione_microaree.sql</strong> in Supabase → SQL Editor, poi ricarica la pagina.';

function maErr(r){ const t=(r.data&&(r.data.message||r.data.code))||r.error||""; return /PGRST205|PGRST204|42P01|42703|does not exist|Could not find|microarea_id|commessa_fasi|commessa_item|commessa_microaree/i.test(t) ? "sql" : (t||("HTTP "+r.status)); }
function maIsDir(){ return CU && CU.ruolo==="direzione"; }
function maCanEdit(){ return CU && (CU.ruolo==="direzione"||CU.ruolo==="cantiere"); }

async function maLoadStruttura(cid){
  const q="commessa_id=eq."+cid;
  const [f,i,m]=await Promise.all([
    sb("commessa_fasi",q+"&select=*&order=ordine"),
    sb("commessa_item",q+"&select=*&order=ordine"),
    sb("commessa_microaree",q+"&select=*")]);
  for(const r of [f,i,m]) if(!r.ok) return {ok:false, err:maErr(r)};
  return {ok:true, fasi:f.data||[], items:i.data||[], cells:m.data||[]};
}

async function maLoadOre(cid){
  let all=[], off=0;
  while(true){
    const r=await sb("rapportini","commessa_id=eq."+cid+"&select=id,data_lavoro,rapportino_righe(microarea_id,nominativo,ore_ord,ore_str,costo_giorno)&limit=1000&offset="+off);
    if(!r.ok) return {ok:false, err:maErr(r)};
    const d=r.data||[]; all=all.concat(d);
    if(d.length<1000) break; off+=1000;
  }
  const ore={}, gen={ore:0,costo:0};
  all.forEach(rp=>(rp.rapportino_righe||[]).forEach(l=>{
    const o=(+l.ore_ord||0)+(+l.ore_str||0), c=+l.costo_giorno||0;
    if(l.microarea_id){
      const a=ore[l.microarea_id]||(ore[l.microarea_id]={ore:0,costo:0,gg:{},ris:{}});
      a.ore+=o; a.costo+=c; if(rp.data_lavoro) a.gg[rp.data_lavoro]=1;
      const n=l.nominativo||"—"; a.ris[n]=(a.ris[n]||0)+o;
    } else { gen.ore+=o; gen.costo+=c; }
  }));
  return {ok:true, ore, gen};
}

// Ogni lavorazione pesa uguale nell'avanzamento (scelta della Direzione).
// Senza ore standard, la produttività si legge sulle ore effettive:
// ore per item completato di ciascuna lavorazione e stima ore a finire.
const MA_SOGLIA_MEDIA = 1.30;
function maCalc(){
  MA.fById={}; MA.fasi.forEach(f=>MA.fById[f.id]=f);
  MA.iById={}; MA.items.forEach(i=>MA.iById[i.id]=i);
  MA.cellBy={}; MA.cells.forEach(x=>MA.cellBy[x.item_id+"|"+x.fase_id]=x);
  const app = MA.cells.filter(x=>x.applicabile && MA.fById[x.fase_id] && MA.iById[x.item_id]);
  const T = {n:app.length,done:0,sp:0,memoTot:0,memoOk:0,eff:0,nD:0,spD:0,warn:0};
  const row={}, col={};
  app.forEach(x=>{
    const p=Math.min(Math.max(+x.perc||0,0),100)/100, it=MA.iById[x.item_id], f=MA.fById[x.fase_id];
    const e=(MA.ore[x.id]||{}).ore||0, terzi=it.esecutore==="Terzi";
    const R=row[it.id]||(row[it.id]={sp:0,ore:0,n:0,done:0});
    const C=col[f.id]||(col[f.id]={sp:0,ore:0,n:0,done:0,effU:0,eqU:0,cnt:0});
    R.sp+=p; R.ore+=e; R.n++; if(p>=1) R.done++;
    C.sp+=p; C.ore+=e; C.n++; if(p>=1) C.done++;
    T.sp+=p; if(p>=1) T.done++;
    if(f.richiede_memo){ T.memoTot++; if(p>=1 && x.memo_rif) T.memoOk++; }
    if(e>0 && p===0) T.warn++;
    if(!terzi){ T.eff+=e; T.nD++; T.spD+=p; if(p>0 && e>0){ C.effU+=e; C.eqU+=p; C.cnt++; } }
  });
  Object.values(col).forEach(C=>{ C.oreUnit = C.eqU>0 ? C.effU/C.eqU : null; });
  T.av  = T.n  ? T.sp/T.n   : 0;
  T.avD = T.nD ? T.spD/T.nD : 0;
  T.eac = T.avD>0 && T.eff>0 ? T.eff/T.avD : null;
  T.oreAttr = Object.values(MA.ore).reduce((a,v)=>a+v.ore,0);
  MA.T=T; MA.row=row; MA.col=col;
}

// Ore della microarea oltre la media della lavorazione (almeno 3 item misurabili)
function maFuoriMedia(x){
  const it=MA.iById[x.item_id], C=MA.col[x.fase_id], e=(MA.ore[x.id]||{}).ore||0, p=(+x.perc||0)/100;
  if(!C || it.esecutore==="Terzi" || !(p>0) || !(e>0) || C.cnt<3 || !C.oreUnit) return null;
  const r=(e/p)/C.oreUnit; return r>MA_SOGLIA_MEDIA ? r : null;
}

async function pgMicro(cid, tab, back){
  const c=document.getElementById("content");

  MA={c:comm, cid:String(cid), tab:tab||(MA&&MA.cid===String(cid)?MA.tab:"av"), back:back||(MA&&MA.back)||"comm", fasi:[], items:[], cells:[], ore:{}, gen:{ore:0,costo:0}};
  c.innerHTML='<div class="empty"><div class="spin"></div>Caricamento microaree...</div>';
  const [s,o]=await Promise.all([maLoadStruttura(comm.id), maLoadOre(comm.id)]);

function maCellHTML(x, f, it){
  if(!x || !x.applicabile) return '<td class="ma-c ma-na">—</td>';
  const p=Math.min(Math.max(+x.perc||0,0),100), e=(MA.ore[x.id]||{}).ore||0;
  const cls = p>=100?"ma-ok":p>0?"ma-p":(e>0?"ma-w":"ma-0");
  const over = maFuoriMedia(x);
  const memoMiss = f.richiede_memo && p>=100 && !x.memo_rif;
  const main = p>=100 ? "✓" : fN(p)+"%";
  const inner = '<b>'+main+'</b><span>'+([e?fN(e,1)+" h":"", f.richiede_memo&&x.memo_rif?"TM":""].filter(Boolean).join(" · ")||"&nbsp;")+'</span>' + (p>0&&p<100?'<i style="width:'+p+'%"></i>':'') + (over?'<em title="Ore per item '+fN((over-1)*100)+'% sopra la media della lavorazione">●</em>':'') + (memoMiss?'<em title="Manca il riferimento al test memo">!</em>':'');
  return '<td class="ma-c '+cls+'">'+(maCanEdit()?'<button onclick="maCell(\''+x.id+'\')" aria-label="'+esc(it.codice+" "+f.nome)+' '+main+'">'+inner+'</button>':'<div>'+inner+'</div>')+'</td>';
}

async function maSaveCell(id){
  const x=MA.cells.find(c=>c.id===id), f=MA.fById[x.fase_id];
  const err=document.getElementById("ma-merr");
  const p=parseFloat(document.getElementById("ma-p").value);
  if(isNaN(p)||p<0||p>100){ err.innerHTML='<div class="alert r" style="margin-top:10px">L\'avanzamento deve essere tra 0 e 100%.</div>'; return; }
  const body={perc:p, note:document.getElementById("ma-nt").value.trim()||null, updated_at:new Date().toISOString(), updated_by:CU.email};
  if(f.richiede_memo){
    body.memo_rif=document.getElementById("ma-mr").value.trim()||null;
    body.memo_data=document.getElementById("ma-md").value||null;
    if(p>=100 && !body.memo_rif){ err.innerHTML='<div class="alert r" style="margin-top:10px">Per segnare la consegna come completata inserisci il numero del test memo.</div>'; return; }
  }
  sync("salvataggio...",false);
  const r=await sb("commessa_microaree","id=eq."+id,"PATCH",body);

  Object.assign(x, body); sync("● Connesso",true);
  maClose(); maCalc(); maRenderAv();
  maMsg("g","✅ "+esc(MA.iById[x.item_id].codice)+" · "+esc(f.nome)+" aggiornata a "+fN(p)+"%");
}

async function maUpd(table,id,body,el){
  sync("salvataggio...",false);
  const r=await sb(table,"id=eq."+id,"PATCH",body);
  if(!r.ok){ sync("● Errore",false); maMsg("r","Modifica non salvata: "+esc((r.data&&r.data.message)||r.status)); if(el) el.style.borderColor="#C00000"; return false; }
  const arr=table==="commessa_fasi"?MA.fasi:MA.items; const o=arr.find(z=>z.id===id); if(o) Object.assign(o,body);
  sync("● Connesso",true); if(el){ el.style.borderColor="#70AD47"; setTimeout(()=>el.style.borderColor="",1200); }
  maCalc(); return true;
}
async function maMove(table,k,dir){
  const arr=table==="commessa_fasi"?MA.fasi:MA.items; const j=k+dir; if(j<0||j>=arr.length) return;
  [arr[k],arr[j]]=[arr[j],arr[k]];
  sync("salvataggio...",false);
  const rs=await Promise.all(arr.map((o,n)=>o.ordine===n?{ok:true}:sb(table,"id=eq."+o.id,"PATCH",{ordine:n}).then(r=>{ if(r.ok) o.ordine=n; return r; })));
  sync(rs.every(r=>r.ok)?"● Connesso":"● Errore", rs.every(r=>r.ok));
  maCalc(); maRenderSt();
}

// ── Import da Excel ──
function maImportPick(){ const f=document.getElementById("ma-file"); if(f) f.click(); }
function maLoadXLSX(){
  if(window.XLSX) return Promise.resolve(true);
  return new Promise(res=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload=()=>res(true); s.onerror=()=>res(false); document.head.appendChild(s); });
}
function maSplit(d){
  d=d.replace(/\s+/g," ").trim();
  let k=d.indexOf(" - ");
  if(k>0) return {codice:d.slice(0,k).trim(), descrizione:d.slice(k+3).trim()};
  const m=d.match(/^(\S*[\/\d]\S*)\s+(.+)$/);
  if(m) return {codice:m[1], descrizione:m[2]};
  return {codice:d, descrizione:""};
}
function maParse(rows){
  let h=-1, ci=-1;
  for(let r=0;r<Math.min(rows.length,40);r++){ const k=(rows[r]||[]).findIndex(v=>/item|descrizione/i.test(String(v))); if(k>=0){ h=r; ci=k; break; } }
  if(h<0) return null;
  const hdr=rows[h].map(v=>String(v||"").replace(/\s+/g," ").trim());
  const cc=hdr.findIndex(v=>/cantiere/i.test(v));
  const fc=[]; hdr.forEach((v,k)=>{ if(k>ci && v && !/inserto/i.test(v)) fc.push(k); });
  if(!fc.length) return null;
  const items=[];
  for(let r=h+1;r<rows.length;r++){
    const row=rows[r]||[], d=String(row[ci]||"").trim();
    if(!d){ if(items.length) break; else continue; }
    items.push({...maSplit(d), cantiere:cc>=0?String(row[cc]||"").trim():"", app:fc.map(k=>String(row[k]==null?"":row[k]).trim()!=="")});
  }
  if(!items.length) return null;
  const cnt={}; items.forEach(it=>{ if(it.cantiere) cnt[it.cantiere.toUpperCase()]=(cnt[it.cantiere.toUpperCase()]||0)+1; });
  const main=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||"";
  items.forEach(it=>{ it.fuori = !!(main && it.cantiere && it.cantiere.toUpperCase()!==main); });
  const titolo = h>0 ? (rows[h-1]||[]).map(v=>String(v||"").trim()).filter(Boolean).join(" ") : "";
  return {titolo, main, fasi:fc.map((k,j)=>({nome:hdr[k], vuota:items.every(it=>!it.app[j]), memo:/consegna|test memo/i.test(hdr[k])})), items};
}
async function maImportFile(file){
  if(!file) return;
  maMsg("b",'<div class="spin"></div>Lettura del file...');
  if(!(await maLoadXLSX())){ maMsg("r","Impossibile caricare il lettore Excel: verifica la connessione internet."); return; }
  let P=null;
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
    for(const n of wb.SheetNames){ P=maParse(XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:false})); if(P) break; }
  }catch(e){ maMsg("r","File non leggibile: "+esc(e.message)); return; }
  if(!P){ maMsg("r","Non trovo la tabella: serve una riga di intestazione con la colonna Item/Descrizione e le colonne delle lavorazioni."); return; }
  MA.imp=P; document.getElementById("ma-msg").innerHTML="";
  const c=document.getElementById("content"); let ov=document.getElementById("ma-ov");
  if(!ov){ ov=document.createElement("div"); ov.id="ma-ov"; c.appendChild(ov); }
  const nApp=P.items.reduce((a,it)=>a+it.app.filter(Boolean).length,0);
  ov.innerHTML='<div class="ma-ovl"><div class="ma-mod ma-wide" role="dialog" aria-modal="true">' +
    '<div class="card-title" style="margin-bottom:2px">Anteprima importazione</div><div class="prod-sub" style="margin-bottom:14px">'+esc(file.name)+(P.titolo?' · '+esc(P.titolo):'')+' · '+P.items.length+' item · '+P.fasi.length+' lavorazioni · '+nApp+' celle con X</div>' +
    '<label class="fl">Lavorazioni</label><table class="ma-ed" style="margin-bottom:14px"><thead><tr><th>Nome</th><th style="text-align:center">Test memo</th><th>Colonna senza X</th></tr></thead><tbody>' +
    P.fasi.map((f,j)=>'<tr><td><input class="fi" id="imf-n'+j+'" value="'+esc(f.nome)+'"></td><td style="text-align:center"><input type="checkbox" id="imf-m'+j+'" '+(f.memo?"checked":"")+'></td>' +
      '<td>'+(f.vuota?'<label style="font-size:12px"><input type="checkbox" id="imf-t'+j+'" checked> prevedi per tutti gli item</label>':'<span class="prod-sub">—</span>')+'</td></tr>').join("") +
    '</tbody></table>' +
    '<label class="fl">Item</label><div style="max-height:260px;overflow:auto;border:1px solid #DEE2E8;border-radius:8px"><table class="ma-ed"><thead><tr><th>Codice</th><th>Descrizione</th><th>Cantiere</th><th class="nr">Lavorazioni</th><th>Esecutore</th></tr></thead><tbody>' +
    P.items.map((it,i)=>'<tr'+(it.fuori?' style="background:#FFF2CC"':'')+'><td><strong>'+esc(it.codice)+'</strong></td><td>'+esc(it.descrizione)+'</td><td>'+esc(it.cantiere)+(it.fuori?' <span class="prod-sub">diverso da '+esc(P.main)+'</span>':'')+'</td><td class="nr">'+it.app.filter(Boolean).length+'</td>' +
      '<td><select class="fs" id="imi-e'+i+'" style="font-size:12px"><option'+(!it.fuori?" selected":"")+'>DI.MA.</option><option'+(it.fuori?" selected":"")+'>Terzi</option></select></td></tr>').join("") +
    '</tbody></table></div>' +
    '<p class="prod-sub" style="margin-top:8px">Gli item eseguiti da terzi contano nell\'avanzamento fisico ma non nelle ore e nella produttività DI.MA. e non compaiono nel rapportino. Le righe evidenziate hanno un cantiere diverso da quello prevalente.</p>' +
    '<div id="ma-merr"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn bo" onclick="maClose()">Annulla</button><button class="btn bp" id="ma-impok" onclick="maImportSave()">Crea struttura</button></div>' +
    '</div></div>';
}
async function maImportSave(){
  const P=MA.imp, cid=MA.c.id, err=document.getElementById("ma-merr"), btn=document.getElementById("ma-impok");
  if(MA.items.length||MA.fasi.length){ err.innerHTML='<div class="alert r" style="margin-top:10px">La commessa ha già una struttura: eliminala prima di importare.</div>'; return; }
  const fasi=P.fasi.map((f,j)=>({commessa_id:cid, ordine:j, nome:document.getElementById("imf-n"+j).value.trim()||f.nome, richiede_memo:document.getElementById("imf-m"+j).checked}));
  const tutti=P.fasi.map((f,j)=>f.vuota && document.getElementById("imf-t"+j) && document.getElementById("imf-t"+j).checked);
  const items=P.items.map((it,i)=>({commessa_id:cid, ordine:i, codice:it.codice, descrizione:it.descrizione||null, cantiere:it.cantiere||null, esecutore:document.getElementById("imi-e"+i).value}));
  btn.disabled=true; btn.textContent="Creazione..."; sync("salvataggio...",false);
  const fail=async(msg)=>{ await sb("commessa_item","commessa_id=eq."+cid,"DELETE"); await sb("commessa_fasi","commessa_id=eq."+cid,"DELETE"); sync("● Errore",false); btn.disabled=false; btn.textContent="Crea struttura"; err.innerHTML='<div class="alert r" style="margin-top:10px">'+msg+'</div>'; };
  const rf=await sb("commessa_fasi","","POST",fasi);
  if(!rf.ok) return fail(maErr(rf)==="sql"?MA_SQL_MSG:"Lavorazioni non create: "+esc((rf.data&&rf.data.message)||rf.status));
  const ri=await sb("commessa_item","","POST",items);
  if(!ri.ok) return fail("Item non creati: "+esc((ri.data&&ri.data.message)||ri.status));
  const fBy={}; rf.data.forEach(f=>fBy[f.ordine]=f.id);
  const iBy={}; ri.data.forEach(i=>iBy[i.ordine]=i.id);
  const cells=[];
  P.items.forEach((it,i)=>P.fasi.forEach((f,j)=>cells.push({commessa_id:cid, item_id:iBy[i], fase_id:fBy[j], applicabile:!!(it.app[j]||tutti[j])})));
  for(let k=0;k<cells.length;k+=500){
    const rc=await sb("commessa_microaree","","POST",cells.slice(k,k+500));
    if(!rc.ok) return fail("Microaree non create: "+esc((rc.data&&rc.data.message)||rc.status));
  }
  sync("● Connesso",true); MA.imp=null;
  await pgMicro(MA.cid,"st");
  maMsg("g","✅ Struttura creata: "+items.length+" item, "+fasi.length+" lavorazioni. Il capo cantiere può già aggiornare l'avanzamento e registrare le ore.");
}
